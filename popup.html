<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon.png">
    <title>Drive Downloader</title>
    <style>
        :root {
            --grad-top:    #f6a5dd;
            --grad-mid1:   #f9a3b5;
            --grad-mid2:   #fb9d86;
            --grad-bottom: #fbaa45;
            --hero-border: #f8a03c;
            --hero-title:  #7a1d12;
            --hero-sub:    #8c3a24;
            --ink:         #111827;
            --ink-soft:    #374151;
            --muted:       #6b7280;
            --faint:       #9ca3af;
            --line:        #e5e7eb;
            --surface:     #ffffff;
            --surface-alt: #f3f4f6;
            --black:       #111111;
            --green:       #22c55e;
            --red:         #ef4444;
            --red-ink:     #b91c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--ink);
            /* Fills the Chrome side panel, whatever width the user drags it to. */
            width: 100%;
            min-width: 300px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }
        .hidden { display: none !important; }
        button { font-family: inherit; }
        button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        svg { display: block; flex-shrink: 0; }

        /* ---------- Top card ---------- */
        .hero {
            margin: 8px 8px 0;
            padding: 10px 12px 12px;
            border: 3px solid var(--hero-border);
            border-radius: 16px;
            background: linear-gradient(180deg,
                var(--grad-top) 0%, var(--grad-mid1) 32%, var(--grad-mid2) 62%, var(--grad-bottom) 100%);
            flex-shrink: 0;
        }
        .hero-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-icon {
            /* icon.png has transparent padding, so draw it larger and pull the edges in */
            width: 34px;
            height: 34px;
            margin: -5px -4px -5px -6px;
            display: block;
            flex-shrink: 0;
            object-fit: contain;
        }
        .brand {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .icon-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.15s ease;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.45); }

        .hero-icon {
            width: 40px;
            height: 40px;
            margin: 14px auto 12px;
            border-radius: 50%;
            background: var(--surface);
            display: grid;
            place-items: center;
            color: var(--ink-soft);
            box-shadow:
                0 0 0 7px rgba(255, 255, 255, 0.35),
                0 0 0 14px rgba(255, 255, 255, 0.15);
        }
        .hero-title {
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: var(--hero-title);
        }
        .hero-sub {
            text-align: center;
            font-size: 11.5px;
            color: var(--hero-sub);
            margin-top: 3px;
            line-height: 1.45;
        }

        .url-pill {
            margin-top: 14px;
            background: var(--surface);
            border-radius: 10px;
            padding: 5px 5px 5px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--line);
            display: grid;
            place-items: center;
            color: transparent;
            transition: background 0.2s ease;
        }
        .status-dot.active { background: var(--green); color: #fff; }
        .tab-url {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-url .scheme { color: var(--faint); }
        .tab-url.example { color: var(--faint); font-size: 11.5px; }
        .tab-url.example .eg { color: var(--muted); font-weight: 500; }

        .pill-btn {
            background: var(--black);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: background 0.15s ease;
        }
        .pill-btn:hover { background: #2a2a2a; }
        .pill-btn:disabled { display: none; }

        .round-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink-soft);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.15s ease;
        }
        .round-btn:hover { background: var(--surface-alt); }

        #statusMessage {
            margin-top: 10px;
            text-align: center;
            font-size: 11.5px;
            line-height: 1.45;
            color: var(--hero-sub);
        }

        /* ---------- List ---------- */
        .section-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            padding: 12px 16px 8px;
            flex-shrink: 0;
        }
        .body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        #downloadContainer {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        #downloadContainer::-webkit-scrollbar { width: 6px; }
        #downloadContainer::-webkit-scrollbar-track { background: transparent; }
        #downloadContainer::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

        .video-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s ease;
        }
        .video-item.is-active { border-color: #fbb07a; }
        .video-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-info {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-meta { display: contents; }
        .video-title {
            order: 2;
            flex: 1;
            min-width: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .quality-badge {
            order: 1;
            font-size: 10.5px;
            font-weight: 500;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 1px 7px;
            flex-shrink: 0;
        }
        .video-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .download-btn {
            background: var(--black);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease;
        }
        .download-btn:hover:not(:disabled) { background: #2a2a2a; }
        .download-btn:disabled,
        .download-btn.disabled-limit { background: var(--surface-alt); color: var(--muted); cursor: not-allowed; }

        .ctrl-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink-soft);
            cursor: pointer;
            font-size: 10px;
            line-height: 1;
            display: inline-grid;
            place-items: center;
            transition: all 0.15s ease;
        }
        .ctrl-btn:hover   { background: var(--surface-alt); }
        .resume-btn       { background: var(--black); border-color: var(--black); color: #fff; }
        .resume-btn:hover { background: #2a2a2a; }
        .cancel-btn:hover { background: #fef2f2; border-color: #fca5a5; color: var(--red-ink); }

        .progress-wrap { display: flex; flex-direction: column; gap: 4px; }
        .progress-bar {
            height: 4px;
            background: var(--surface-alt);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--grad-top), var(--grad-mid2), var(--grad-bottom));
            transition: width 0.1s linear;
        }
        .progress-fill.error     { background: var(--red); }
        .progress-fill.completed { background: var(--green); }
        .progress-text {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .progress-text .pp { color: var(--ink); font-weight: 600; }

        .empty-state {
            text-align: center;
            padding: 32px 20px;
            font-size: 12px;
            color: var(--faint);
            line-height: 1.6;
        }

        .alert-banner {
            margin: 0 12px 10px;
            padding: 7px 12px;
            border-radius: 10px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            font-size: 11.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .alert-banner .blink {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f97316;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="hero hidden" id="header">
        <div class="hero-head">
            <img class="brand-icon" src="icon.png" alt="" width="34" height="34">
            <span class="brand">Drive Downloader</span>
            <button class="icon-btn" id="clearHistoryBtn" title="Clear history" aria-label="Clear history">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>
            </button>
        </div>

        <div class="hero-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        </div>
        <div class="hero-title" id="heroTitle">Capturing is off</div>
        <div class="hero-sub" id="heroSub"></div>

        <div class="url-pill">
            <span class="status-dot" id="statusDot" aria-hidden="true">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
            <span class="tab-url" id="tabUrl"></span>
            <button class="round-btn hidden" id="reloadBtn" title="Refresh the Drive page" aria-label="Refresh the Drive page">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            </button>
            <button class="pill-btn" id="btnOn">
                Turn on
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            </button>
            <button class="pill-btn" id="btnOff" disabled>Turn off</button>
        </div>

        <div id="statusMessage" class="hidden"></div>
    </div>

    <div class="section-label">Downloads</div>
    <div class="body">
        <div id="downloadContainer"></div>
    </div>

    <div class="alert-banner hidden" id="downloadAlert">
        <span class="blink"></span>
        <span id="alertText">Keep the Drive tab open</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
